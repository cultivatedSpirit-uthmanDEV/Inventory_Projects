{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow mt-5">
            <div class="card-header text-center">
                <h3>Login</h3>
            </div>

            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                <hr>

                <p class="text-center">
                    Don't have an account?
                    <a href="{% url 'register' %}">
                        Register
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>
{% endblock %}
