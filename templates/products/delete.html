{% extends "base.html" %}

{% block content %}

{% if product %}
<div class="container mt-5">

    <h3>Delete Product</h3>

    <p>
        Are you sure you want to delete
        <strong>{{ product.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Delete
        </button>

        <a href="{% url 'display' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>
{% endif %}

{% endblock content %}
